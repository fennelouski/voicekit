name: Apple platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build and deterministic regression suites
        run: swift test
      - name: Bundle and validate app
        env:
          BUILD_CONFIGURATION: debug
          CODE_SIGN_IDENTITY: '-'
        run: |
          Scripts/make-app.sh
          Scripts/validate-app.sh build/Dictate.app
      - name: Whitespace
        run: git diff --check
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate project
        run: |
          brew install xcodegen
          cd iOS
          xcodegen generate
      - name: Keyboard pipeline on simulator
        run: Scripts/test-ios.sh
